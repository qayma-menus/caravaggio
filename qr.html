<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>استوديو كروت الـ QR — كاراڤاچيو Caravaggio Coffee</title>
    <link rel="icon" href="./assets/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@700;800;900&family=Cairo:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .qr-toolbar {
        background: #ffffff;
        border-bottom: 1px solid var(--border-subtle);
        padding: 16px 0;
      }
      .qr-bar-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .cafe-qr-card {
        max-width: 430px;
        margin: 32px auto;
        background: linear-gradient(160deg, #24140d 0%, #3a2217 65%, #234934 100%);
        color: #ffffff;
        border: 3px solid var(--brand-tangerine);
        border-radius: 26px;
        box-shadow: 0 16px 40px rgba(34, 22, 16, 0.25);
        padding: 30px 24px;
        text-align: center;
      }
      .cafe-qr-logo {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--brand-tangerine);
      }
      .cafe-qr-frame {
        background: #ffffff;
        color: var(--ink);
        border-radius: 20px;
        padding: 16px;
        max-width: 245px;
        margin: 18px auto 0 auto;
      }
      .tables-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
        gap: 16px;
        margin-top: 28px;
      }
      .table-tent {
        background: #ffffff;
        border: 2px solid var(--brand-primary);
        border-radius: 18px;
        padding: 16px;
        text-align: center;
        break-inside: avoid;
      }
      @media print {
        .tables-grid {
          grid-template-columns: 1fr 1fr;
        }
        .cafe-qr-card {
          box-shadow: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="qr-toolbar no-print">
      <div class="container">
        <div class="qr-bar-row">
          <div style="display:flex;align-items:center;gap:10px">
            <a href="./index.html" class="btn-outline-paper" style="border:1px solid #dfd3c5">العودة للمنيو</a>
            <div>
              <strong style="font-family:var(--font-display);font-size:16px;color:var(--brand-primary)">
                استوديو كروت الـ QR — كاراڤاچيو Caravaggio
              </strong>
              <div style="font-size:11px;color:var(--ink-muted);font-weight:700">
                كارت الكاشير + كروت الترابيزات المرقمة لفرعي التحرير والمواساة
              </div>
            </div>
          </div>

          <div style="display:flex;gap:8px">
            <button type="button" id="btn-dl-png" class="btn-outline-paper" style="background:var(--brand-accent);border:1px solid #f4d6b4">
              تحميل صورة QR (PNG)
            </button>
            <button type="button" onclick="window.print()" class="btn-add" style="padding:8px 18px">
              طباعة جاهزة (A4)
            </button>
          </div>
        </div>

        <div class="qr-bar-row" style="margin-top:12px">
          <div style="display:flex;gap:8px">
            <button type="button" id="tab-main" class="option-btn selected">
              كارت الكاشير والأكواب
            </button>
            <button type="button" id="tab-tables" class="option-btn">
              كروت ترابيزات الكافيه
            </button>
          </div>

          <div style="display:flex;gap:8px;flex:1;max-width:420px">
            <input
              type="url"
              dir="ltr"
              id="base-url-input"
              class="text-input"
              style="font-family:monospace;font-size:12px"
            />
          </div>

          <div id="table-count-wrap" class="hidden" style="display:flex;align-items:center;gap:6px">
            <span style="font-size:12px;font-weight:900">عدد الترابيزات:</span>
            <select id="table-count" class="option-btn">
              <option value="8">8</option>
              <option value="12" selected>12</option>
              <option value="16">16</option>
              <option value="24">24</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <main class="container" id="qr-canvas-root"></main>

    <script src="./data.js"></script>
    <script src="./vendor/qr.js"></script>
    <script>
      (function () {
        var R = window.RESTAURANT_DATA;
        var C = window.CREDITS_CONFIG || {};
        var mode = "main";
        var urlInput = document.getElementById("base-url-input");
        var countSelect = document.getElementById("table-count");
        var countWrap = document.getElementById("table-count-wrap");

        var defaultUrl = window.location.href
          .split("?")[0]
          .replace(/\/qr\.html$/, "/");
        urlInput.value = defaultUrl;

        function render() {
          var baseUrl = urlInput.value.trim() || defaultUrl;
          var root = document.getElementById("qr-canvas-root");

          if (mode === "main") {
            countWrap.classList.add("hidden");
            document.getElementById("btn-dl-png").classList.remove("hidden");
            var svg = window.QaymaQR.toSVG(baseUrl, { margin: 4, dark: "#221610" });
            root.innerHTML =
              '<div class="cafe-qr-card">' +
              '  <img class="cafe-qr-logo" src="./assets/logo.jpg" alt="' + R.name + '">' +
              '  <h2 style="margin:12px 0 6px 0;font-family:var(--font-display);font-size:24px;font-weight:900">' + R.name + '</h2>' +
              '  <span class="identity-tagline">' + R.tagline + '</span>' +
              '  <div class="cafe-qr-frame">' +
              svg +
              '    <div style="margin-top:8px;font-size:12.5px;font-weight:900;color:var(--brand-primary)">امسح الكود لتصفح المنيو والطلب أونلاين</div>' +
              '  </div>' +
              '  <div style="margin-top:14px;font-size:12px;font-weight:800;line-height:1.8">' +
              '    <div>فرع التحرير • فرع المواساة — كوم حمادة</div>' +
              '    <div dir="ltr" style="color:#f9a826;font-size:15px;font-weight:900">' + R.phone + '</div>' +
              '  </div>' +
              '  <div style="margin-top:14px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.2);font-size:10.5px;font-weight:800">منيو رقمي من قايمة • qayma.me • ' + (C.developerName || "م/ محمد عبدالستار") + '</div>' +
              '</div>';
          } else {
            countWrap.classList.remove("hidden");
            document.getElementById("btn-dl-png").classList.add("hidden");
            var n = parseInt(countSelect.value, 10) || 12;
            var cards = [];
            for (var t = 1; t <= n; t++) {
              var sep = baseUrl.indexOf("?") >= 0 ? "&" : "?";
              var tUrl = baseUrl + sep + "table=" + t;
              var tSvg = window.QaymaQR.toSVG(tUrl, { margin: 4, dark: "#221610" });
              cards.push(
                '<div class="table-tent">' +
                '  <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e7ddd1;padding-bottom:10px;margin-bottom:12px">' +
                '    <div style="display:flex;align-items:center;gap:8px;text-align:right">' +
                '      <img src="./assets/logo.jpg" alt="" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:1.5px solid var(--brand-tangerine)">' +
                '      <div style="font-family:var(--font-display);font-size:13px;font-weight:900;color:var(--brand-primary)">Caravaggio</div>' +
                '    </div>' +
                '    <span style="background:var(--brand-tangerine);color:#fff;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:900">ترابيزة ' + t + '</span>' +
                '  </div>' +
                '  <div style="max-width:168px;margin:0 auto;border:1.5px solid #e7ddd1;border-radius:14px;padding:6px">' + tSvg + '</div>' +
                '  <div style="margin-top:10px;font-size:12px;font-weight:900">امسح الكود واطلب على ترابيزتك</div>' +
                '  <div style="margin-top:3px;font-size:10px;color:var(--ink-muted);font-weight:800">منيو قايمة الرقمي • qayma.me</div>' +
                '</div>'
              );
            }
            root.innerHTML = '<div class="tables-grid">' + cards.join("") + '</div>';
          }
        }

        document.getElementById("tab-main").addEventListener("click", function () {
          mode = "main";
          this.classList.add("selected");
          document.getElementById("tab-tables").classList.remove("selected");
          render();
        });

        document.getElementById("tab-tables").addEventListener("click", function () {
          mode = "tables";
          this.classList.add("selected");
          document.getElementById("tab-main").classList.remove("selected");
          render();
        });

        urlInput.addEventListener("input", render);
        countSelect.addEventListener("change", render);

        document.getElementById("btn-dl-png").addEventListener("click", function () {
          var baseUrl = urlInput.value.trim() || defaultUrl;
          var dataUrl = window.QaymaQR.toDataURL(baseUrl, { width: 700, margin: 4, dark: "#221610" });
          var a = document.createElement("a");
          a.href = dataUrl;
          a.download = "caravaggio-qr.png";
          a.click();
        });

        render();
      })();
    </script>
  </body>
</html>
